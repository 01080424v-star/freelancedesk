<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід &mdash; {{ site_settings.get('site_name', 'FreelanceDesk') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">{{ site_settings.get('site_name', 'FreelanceDesk') }}</h1>
      <p class="login-sub">Адміністративна панель</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label" for="username">Логін</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            autofocus
            autocomplete="username"
            required
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            autocomplete="current-password"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary btn-block">Увійти</button>
      </form>
    </div>
  </div>
</body>
</html>
